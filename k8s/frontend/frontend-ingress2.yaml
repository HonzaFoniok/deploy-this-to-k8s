apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress2
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
spec:
  tls:
    - hosts:
        - frontend.fuf.sikademo.com
      secretName: frontend-ingress2-tls
  rules:
    - host: frontend.fuf.sikademo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-app-service
                port:
                    number: 80
