{{ if .Values.ingressHosts }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
spec:
  tls:
    - hosts:
        {{- range .Values.ingressHosts}}
        - {{ . }}
        {{- end}}
      secretName: frontend-ingress-tls
  rules:
    {{- range .Values.ingressHosts}}
      - host: {{ . }}
        http:
          paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: frontend-app-service
                  port:
                    number: 80
    {{- end}}
{{- end }}
