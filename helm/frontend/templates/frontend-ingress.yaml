apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
spec:
  rules: 
    {{- range .Values.ingress.host}}
      - host: {{ . }}
        http:
          paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: frontend-app-service
                  port: 
                    number: 80
    {{- end}}
